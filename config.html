<style>
  /* ncCAM owns the whole dialog: its own rail, Close and footer. */
  .plugin-dialog-header { display: none !important; }
  .plugin-dialog-content { padding: 0 !important; }

  .ncc-wrapper {
    --ncc-op-face: #93a2b4;
    --ncc-op-pocket: #1abc9c;
    --ncc-op-hole: #4ea1ff;
    --ncc-op-step: #2ecc71;
    --ncc-op-corners: #48d1b4;
    --ncc-op-cutout: #a78bfa;
    --ncc-info: #4ea1ff;
    width: 1180px;
    max-width: 95vw;
    height: 85vh;
    max-height: 85vh;
    display: flex;
    background: var(--color-surface);
    color: var(--color-text-primary);
    border-radius: var(--radius-medium);
    overflow: hidden;
    font-size: 14px;
    position: relative;
  }
  /* Almost full screen, 24 px clear all round, in landscape and portrait (the dialog itself stops at 85vh) */
  .plugin-dialog-container:has(.ncc-wrapper) { max-height: none !important; max-width: none !important; }
  .ncc-wrapper { width: calc(100vw - 48px) !important; max-width: none !important; height: calc(100vh - 48px) !important; max-height: none !important; }
  .ncc-wrapper * { box-sizing: border-box; }
  .ncc-wrapper button { font-family: inherit; cursor: pointer; }
  .ncc-wrapper button:disabled { cursor: default; opacity: .45; }
  .ncc-mono { font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace; font-variant-numeric: tabular-nums; }

  /* Rail */
  .ncc-rail {
    width: 220px; flex-shrink: 0; display: flex; flex-direction: column;
    background: var(--color-surface-muted); border-right: 1px solid var(--color-border);
    padding: 22px 14px 14px;
  }
  .ncc-rail-head { padding: 0 10px 18px; margin-bottom: 12px; border-bottom: 1px solid var(--color-border); }
  .ncc-eyebrow { font-size: 10px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--color-accent); }
  .ncc-rail-title { font-size: 1.05rem; font-weight: 600; margin-top: 2px; }
  .ncc-beta { margin-left: 4px; font-size: .55em; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--color-accent); vertical-align: super; line-height: 1; }
  .ncc-rail-sub { font-size: 12px; color: var(--color-text-secondary); margin-top: 4px; }
  .ncc-steps { display: flex; flex-direction: column; gap: 6px; flex: 1; }
  .ncc-step {
    display: flex; align-items: center; gap: 12px; padding: 11px 10px !important; border-radius: 10px !important;
    background: transparent !important; border: 0 !important; color: var(--color-text-secondary) !important; font-size: .9rem !important; font-weight: 500 !important; text-align: left !important; width: 100% !important;
  }
  .ncc-step.on { background: color-mix(in srgb, var(--color-accent) 14%, transparent) !important; color: var(--color-text-primary) !important; }
  .ncc-num {
    width: 26px; height: 26px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    font-size: 12px; font-weight: 700; background: var(--color-surface); color: var(--color-text-secondary);
  }
  .ncc-step.on .ncc-num { background: var(--color-accent) !important; color: #fff !important; }
  .ncc-step.done .ncc-num { background: color-mix(in srgb, var(--color-success, #2ecc71) 18%, transparent) !important; color: var(--color-success, #2ecc71) !important; }
  .ncc-close {
    display: flex; align-items: center; gap: 10px; padding: 12px 10px !important; border: 0 !important; border-radius: 10px !important; width: 100% !important;
    background: var(--gradient-accent, var(--color-accent)) !important; color: #fff !important; justify-content: center; font-size: .9rem !important; font-weight: 500 !important;
  }

  /* Main */
  .ncc-main { flex: 1; display: flex; flex-direction: column; min-width: 0; container-type: inline-size; }
  .ncc-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; padding: 24px 28px 0; }
  .ncc-top h1 { margin: 0; font-size: 26px; font-weight: 600; letter-spacing: -.02em; text-wrap: balance; }
  .ncc-lede { margin: 6px 0 0; color: var(--color-text-secondary); font-size: 15px; }
  .ncc-conn { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--color-text-secondary); background: var(--color-surface-muted); padding: 7px 12px; border-radius: 20px; white-space: nowrap; }
  .ncc-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--color-text-secondary); }
  .ncc-dot.ok { background: var(--color-success, #2ecc71); }
  .ncc-body { flex: 1; display: flex; gap: 20px; padding: 20px 28px; min-height: 0; overflow: auto; }
  .ncc-col { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
  .ncc-side { width: 330px; flex-shrink: 0; }
  @container (min-width: 1300px) { .ncc-side { width: 380px; } }
  .ncc-grow { flex: 1 1 0; }
  .ncc-foot { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 14px 28px; border-top: 1px solid var(--color-border); }
  .ncc-back { padding: 12px 22px !important; border: 0 !important; border-radius: 10px !important; background: var(--color-surface-muted) !important; color: var(--color-text-primary) !important; font-weight: 600 !important; font-size: 14px !important; }
  .ncc-next { padding: 12px 24px !important; border: 0 !important; border-radius: 10px !important; background: var(--color-accent) !important; color: #fff !important; font-weight: 700 !important; font-size: 14px !important; display: flex; align-items: center; gap: 8px; }
  .ncc-foot-note { flex: 1; text-align: right; font-size: 13px; color: var(--color-text-secondary); }
  @container (max-width: 820px) {
    .ncc-body { flex-direction: column; }
    .ncc-side { width: auto; }
    .ncc-body > .ncc-half { flex: none; }
    .ncc-body .ncc-mat-card { flex: none; }
    .ncc-body .ncc-mat-swatch { width: 28px; height: 28px; border-radius: 8px; }
    .ncc-body > .ncc-half:last-child { flex: 1 0 auto; }
    .ncc-body .ncc-zero { min-height: 420px; }
    .ncc-body > .ncc-half .ncc-viewcard { flex: none; height: 560px; min-height: 0 !important; }
    .ncc-viewport { min-height: 380px; }
  }

  /* Pieces */
  .ncc-card { background: var(--color-surface-muted); border-radius: var(--radius-medium); padding: 18px; display: flex; flex-direction: column; gap: 12px; }
  .ncc-label { font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--color-text-secondary); }
  .ncc-row { display: flex; align-items: center; justify-content: space-between; gap: 14px; }
  .ncc-row-text { min-width: 0; }
  .ncc-row-title { font-weight: 600; }
  .ncc-row-sub { font-size: 13px; color: var(--color-text-secondary); margin-top: 3px; }
  .ncc-chip { display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px !important; border-radius: 20px !important; background: var(--color-surface) !important; font-size: 12px !important; color: var(--color-text-primary) !important; border: 0 !important; }
  .ncc-chip.on { background: var(--color-accent) !important; color: #fff !important; }
  .ncc-swatch { width: 10px; height: 10px; border-radius: 3px; flex-shrink: 0; }
  .ncc-hint { display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: 12px; font-size: 13px; line-height: 1.45;
    background: color-mix(in srgb, var(--ncc-info) 12%, transparent); color: var(--color-text-primary); }
  .ncc-hint svg { flex-shrink: 0; margin-top: 1px; color: var(--ncc-info); }
  .ncc-hint.bad { background: color-mix(in srgb, var(--color-danger, #e74c3c) 12%, transparent); }
  .ncc-hint.bad svg { color: var(--color-danger, #e74c3c); }
  .ncc-ok { color: var(--color-success, #2ecc71); }
  .ncc-bad { color: var(--color-danger, #e74c3c); }

  .ncc-picks { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
  .ncc-pick {
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-height: 64px !important; padding: 8px !important;
    border: 2px solid transparent !important; border-radius: 12px !important; background: var(--color-surface) !important; color: var(--color-text-primary) !important; font-size: 13px !important; font-weight: 600 !important;
  }
  .ncc-pick small { font-weight: 500 !important; font-size: 11px !important; color: var(--color-text-secondary) !important; }
  .ncc-pick.sel { border-color: var(--color-accent) !important; background: color-mix(in srgb, var(--color-accent) 12%, var(--color-surface)) !important; }

  .ncc-toggle { width: 46px !important; height: 28px !important; border-radius: 14px !important; border: 0 !important; padding: 0 !important; position: relative; flex-shrink: 0; background: var(--color-border) !important; }
  .ncc-toggle::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px !important; height: 22px !important; border-radius: 50% !important; background: #fff !important; transition: left .15s; box-shadow: 0 1px 3px rgba(0,0,0,.25) !important; }
  .ncc-toggle[aria-checked="true"] { background: var(--color-accent) !important; }
  .ncc-toggle[aria-checked="true"]::after { left: 21px; }

  .ncc-fields { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
  .ncc-field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .ncc-field label { font-size: 12px; color: var(--color-text-secondary); }
  .ncc-input, .ncc-select {
    width: 100% !important; padding: 10px 12px !important; border-radius: 10px !important; border: 1px solid var(--color-border) !important;
    background: var(--color-surface) !important; color: var(--color-text-primary) !important; font-size: 15px !important;
  }
  .ncc-input:disabled { opacity: .6; }
  .ncc-seg { display: flex; background: var(--color-surface); border-radius: 10px; padding: 4px; gap: 4px; }
  .ncc-seg button { flex: 1; padding: 9px 10px !important; border: 0 !important; border-radius: 8px !important; background: transparent !important; color: var(--color-text-secondary) !important; font-weight: 600 !important; font-size: 13px !important; }
  .ncc-seg button.sel { background: var(--color-accent) !important; color: #fff !important; }

  .ncc-btn { padding: 10px 16px !important; border: 0 !important; border-radius: 10px !important; background: var(--color-accent) !important; color: #fff !important; font-weight: 700 !important; font-size: 14px !important; }
  .ncc-btn.muted { background: var(--color-surface) !important; color: var(--color-text-primary) !important; font-weight: 600 !important; }

  /* Step 1 */
  .ncc-drop {
    flex: 1; min-height: 360px; border-radius: var(--radius-medium); border: 2px dashed color-mix(in srgb, var(--color-accent) 45%, transparent);
    background: color-mix(in srgb, var(--color-accent) 5%, var(--color-surface-muted));
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; text-align: center; padding: 24px;
  }
  .ncc-drop.over { border-color: var(--color-accent); background: color-mix(in srgb, var(--color-accent) 12%, var(--color-surface-muted)); }
  .ncc-drop-icon { width: 64px; height: 64px; border-radius: 18px; display: flex; align-items: center; justify-content: center; background: color-mix(in srgb, var(--color-accent) 16%, transparent); color: var(--color-accent); }
  .ncc-drop h2 { margin: 0; font-size: 20px; font-weight: 600; }
  .ncc-drop p { margin: 0; color: var(--color-text-secondary); max-width: 46ch; line-height: 1.5; }
  .ncc-file { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .ncc-file-name { font-weight: 600; font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ncc-file-sub { font-size: 12px; color: var(--color-text-secondary); }
  .ncc-viewcard { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 12px; padding: 14px; }
  .ncc-viewport {
    position: relative; flex: 1; min-height: 300px; border-radius: 12px; overflow: hidden;
    background: radial-gradient(ellipse at 50% 35%, color-mix(in srgb, var(--color-surface-muted) 70%, #6f8aa8) 0%, var(--color-surface-muted) 75%);
  }
  .ncc-viewport canvas { display: block; width: 100% !important; height: 100% !important; touch-action: none; }
  .ncc-overlay { position: absolute; display: flex; gap: 6px; pointer-events: none; }
  .ncc-overlay > * { pointer-events: auto; }
  .ncc-overlay.tl { left: 12px; top: 12px; flex-direction: column; align-items: flex-start; }
  .ncc-overlay.tr { right: 12px; top: 12px; flex-direction: column; align-items: flex-end; }
  .ncc-overlay.bl { left: 12px; bottom: 12px; flex-wrap: wrap; }
  .ncc-busy { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; gap: 12px; color: var(--color-text-secondary); background: color-mix(in srgb, var(--color-surface-muted) 70%, transparent); }
  .ncc-spin { width: 22px; height: 22px; border-radius: 50%; border: 3px solid color-mix(in srgb, var(--color-accent) 25%, transparent); border-top-color: var(--color-accent); animation: ncc-spin .8s linear infinite; }
  @keyframes ncc-spin { to { transform: rotate(360deg); } }
  .ncc-found { display: flex; flex-direction: column; gap: 10px; }

  /* Step 2 */
  .ncc-half { flex: 1 1 0; }
  /* Landscape: the material tiles take the left column's spare height */
  .ncc-mat-card { flex: 1; }
  .ncc-mats { flex: 1; grid-auto-rows: 1fr; }
  .ncc-mat { gap: 8px !important; }
  .ncc-mat-swatch { width: 44px; height: 44px; border-radius: 12px; box-shadow: inset 0 0 0 1px rgba(0,0,0,.08); }
  .ncc-zero-card { flex: 1; }
  .ncc-zero { position: relative; flex: 1; min-height: 300px; border-radius: 12px; background: var(--color-surface); color: var(--color-text-primary); container-type: size; display: flex; align-items: center; justify-content: center; }
  .ncc-zero > .ncc-viewport { position: absolute; inset: 0; min-height: 0; border-radius: 12px; }
  .ncc-zero-box { position: relative; width: min(100cqw, 125cqh); height: min(100cqh, 80cqw); }
  .ncc-zero-box svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  /* A small ring to look at, a finger-sized button to tap */
  .ncc-zp { position: absolute; width: 44px !important; height: 44px !important; margin: -22px 0 0 -22px !important; padding: 0 !important; border: 0 !important; background: transparent !important; box-shadow: none !important; }
  .ncc-zp::before { content: ""; position: absolute; left: 50%; top: 50%; width: 14px; height: 14px; margin: -7px 0 0 -7px; border-radius: 50%; border: 2px solid var(--color-text-secondary); background: var(--color-surface); box-sizing: border-box; transition: transform .15s; }
  .ncc-zp:hover::before { transform: scale(1.25); border-color: var(--color-accent); }
  .ncc-zp.sel::before { width: 18px; height: 18px; margin: -9px 0 0 -9px; border: 3px solid var(--color-surface); background: var(--color-accent); box-shadow: 0 0 0 2px var(--color-accent); }
  .ncc-zp.sel::after { content: ""; position: absolute; left: 50%; top: 50%; width: 18px; height: 18px; margin: -9px 0 0 -9px; border-radius: 50%; border: 2px solid var(--color-accent); animation: ncc-pulse 1.6s ease-out infinite; pointer-events: none; }
  @keyframes ncc-pulse { from { transform: scale(1); opacity: .8; } to { transform: scale(2.8); opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .ncc-zp.sel::after { animation: none; opacity: 0; } }
  .ncc-stepper { display: flex; align-items: center; gap: 6px; }
  .ncc-stepper button { display: inline-flex; align-items: center; justify-content: center; width: 44px !important; height: 44px !important; padding: 0 !important; border: 0 !important; border-radius: 10px !important; background: var(--color-surface) !important; color: var(--color-text-primary) !important; font-size: 22px !important; font-weight: 600 !important; line-height: 1 !important; }
  .ncc-stepper span { min-width: 36px !important; font-size: 17px; text-align: center !important; font-weight: 600 !important; }

  /* Step 3 */
  .ncc-ops { display: flex; flex-direction: column; gap: 8px; }
  .ncc-op { display: flex; align-items: center; gap: 16px; min-height: 76px; padding: 14px 18px; border-radius: 14px; background: var(--color-surface-muted); border: 2px solid transparent; cursor: pointer; }
  .ncc-op.focus { border-color: var(--color-accent); }
  .ncc-body.fixed { overflow: hidden; }
  .ncc-plan { flex: 1; min-height: 0; min-width: 0; display: grid; gap: 14px 20px;
    grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); grid-template-rows: minmax(0, 1fr) auto;
    grid-template-areas: "list view" "list pair"; }
  .ncc-plan-list { grid-area: list; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; padding-right: 4px; }
  .ncc-plan-view { grid-area: view; min-height: 0; }
  .ncc-plan-pair { grid-area: pair; }
  .ncc-plan-pair-in { display: none; }
  @container (max-width: 820px) {
    .ncc-plan { grid-template-columns: minmax(0, 1fr); grid-template-rows: 520px minmax(0, 1fr); grid-template-areas: "view" "list"; }
    .ncc-plan-pair { display: none; }
    .ncc-plan-pair-in { display: block; }
  }
  .ncc-pair { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
  @container (max-width: 820px) { .ncc-pair { grid-template-columns: minmax(0, 1fr); } }
  .ncc-op.off { opacity: .55; }
  .ncc-op-icon { width: 42px; height: 42px; border-radius: 10px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .ncc-op-text { flex: 1; min-width: 0; }
  .ncc-op-title { font-weight: 600; font-size: 16px; }
  .ncc-op-sub { font-size: 13px; color: var(--color-text-secondary); margin-top: 4px; }
  .ncc-op .ncc-select { width: 260px !important; flex-shrink: 0; padding: 10px 12px !important; font-size: 14px !important; }
  /* The tool picker stays on the row; only very narrow screens give it a line of its own */
  @container (max-width: 820px) { .ncc-op .ncc-select { width: 240px !important; } }
  @container (max-width: 560px) { .ncc-op { flex-wrap: wrap; } .ncc-op .ncc-select { width: 100% !important; order: 3; } }
  .ncc-slot { font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 6px; background: color-mix(in srgb, var(--color-accent) 14%, transparent); color: var(--color-accent); white-space: nowrap; }
  .ncc-slot.hand { background: color-mix(in srgb, var(--ncc-info) 14%, transparent); color: var(--ncc-info); }

  /* Step 4 */
  .ncc-play { display: flex; align-items: center; gap: 12px; }
  .ncc-playbtn { width: 42px !important; height: 42px !important; border-radius: 50% !important; border: 0 !important; background: var(--color-accent) !important; color: #fff !important; display: flex; align-items: center; justify-content: center; flex-shrink: 0; padding: 0 !important; }
  .ncc-track { flex: 1; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
  .ncc-bar { position: relative; height: 12px; border-radius: 6px; background: var(--color-surface); display: flex; gap: 2px; overflow: hidden; cursor: pointer; touch-action: none; }
  .ncc-bar > i { display: block; height: 100%; opacity: .35; }
  .ncc-bar > b { position: absolute; top: 0; bottom: 0; left: 0; background: color-mix(in srgb, var(--color-text-primary) 18%, transparent); pointer-events: none; }
  .ncc-bar > em { position: absolute; top: -3px; width: 4px; height: 18px; margin-left: -2px; border-radius: 2px; background: var(--color-text-primary); pointer-events: none; }
  .ncc-stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
  .ncc-stat b { display: block; font-size: 22px; font-weight: 600; letter-spacing: -.02em; }
  .ncc-stat span { font-size: 12px; color: var(--color-text-secondary); }
  .ncc-check { display: flex; align-items: flex-start; gap: 10px; font-size: 13px; line-height: 1.4; }
  .ncc-ck { width: 20px; height: 20px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .ncc-ck.ok { background: color-mix(in srgb, var(--color-success, #2ecc71) 18%, transparent); color: var(--color-success, #2ecc71); }
  .ncc-ck.bad { background: color-mix(in srgb, var(--color-danger, #e74c3c) 18%, transparent); color: var(--color-danger, #e74c3c); }
  .ncc-ck.info { background: color-mix(in srgb, var(--ncc-info) 18%, transparent); color: var(--ncc-info); }
  .ncc-toast { position: absolute; left: 50%; bottom: 84px; transform: translateX(-50%); padding: 10px 16px; border-radius: 10px; background: var(--color-text-primary); color: var(--color-surface); font-size: 13px; font-weight: 600; box-shadow: 0 6px 20px rgba(0,0,0,.25); }
</style>

<div class="ncc-wrapper" id="ncc-root">
  <div class="ncc-busy" style="position: static; flex: 1; background: none;"><span class="ncc-spin"></span>Starting ncCAM…</div>
</div>

<script>
(function () {
  var PORT = __SERVER_PORT__;
  var BUILD = '0.1.1-mvu75z7m';
  var base = window.ncSender && typeof window.ncSender.getApiBaseUrl === 'function' ? window.ncSender.getApiBaseUrl(PORT) : '';
  var file = function (name) { return base + '/api/plugins/com.ncsender.nccam/icon?file=' + encodeURIComponent(name); };
  var root = document.getElementById('ncc-root');
  var start = function () { window.NcCam.mount(root, { base: base, file: file }); };
  if (window.NcCam && window.NcCam.build === BUILD) return start();
  fetch(file('lib/nccam.js'))
    .then(function (r) { if (!r.ok) throw new Error('lib/nccam.js: ' + r.status); return r.text(); })
    .then(function (code) {
      var s = document.createElement('script');
      s.textContent = code;
      document.head.appendChild(s);
      window.NcCam.source = code;
      start();
    })
    .catch(function (err) {
      root.innerHTML = '<div class="ncc-busy" style="position: static; flex: 1; background: none;">ncCAM could not start: ' + String(err.message || err).replace(/</g, '&lt;') + '</div>';
    });
})();
</script>
